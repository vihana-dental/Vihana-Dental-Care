name: Keep Render instance awake

on:
  schedule:
    # Every 10 minutes — comfortably under Render's free-tier 15-minute
    # inactivity sleep window.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://vihanadental.in/api/health)
          echo "Health check responded with HTTP $status"
          if [ "$status" -ge 500 ]; then
            echo "::warning::vihanadental.in health check returned $status"
          fi
