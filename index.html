         <picture> element in Hero.tsx exactly, so only the crop that will
         actually be displayed is fetched. -->

    <link rel="preload" as="image" href="/images/hero-desktop.webp" type="image/webp" media="(min-width: 1024px)" fetchpriority="high" />
